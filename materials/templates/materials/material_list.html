{% extends "core/base.html" %}

{% block title %}Materials{% endblock %}

{% block content %}

<div class="mb-6 p-4 border rounded-lg bg-gray-50">
    <form method="get" action="{% url 'materials_material_list' %}" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div class="col-span-1">
            <label for="id_material" class="block text-sm font-medium text-gray-700">ID Material</label>
            <input type="text" name="id_material" id="id_material" value="{{request.GET.id_material}}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-200 focus:ring-opacity-50">
        </div>

        <div class="col-span-1">
            <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
            <input type="text" name="name" id="name" value="{{request.GET.name}}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-200 focus:ring-opacity-50">
        </div>
    
        <div class="col-span-1">
            <label for="material_type" class="block text-sm font-medium text-gray-700">Material Type</label>
            <input type="text" name="material_type" id="material_type" value="{{request.GET.material_type}}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-200 focus:ring-opacity-50">
        </div>

        <div class="col-span-1">
            <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
            <select name="status" id="status" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-200 focus:ring-opacity-50">
            <option value="" {% if not request.GET.status %}select{% endif %}>All</option>
            <option value="Active" {% if not request.GET.status == "Active" %}selected{% endif %}>Active</option>
            <option value="Inactive" {% if not request.GET.status == "Inactive" %}selected{% endif %}>Inactive</option>
            </select>
        </div>
    </form>
</div>


<div class="col-span-1 md:col-span-4">
    <div class="flex items-center justify-between">
        <div class="flex space-x-2">
            <button type="submit" class="w-full md:w-auto bg-[#233b6e] text-white px-4 py-2 rounded-lg shadow-md hover:bg-[#1a2c53] transition-colors duration-300">Filter</button>
            <a href="{% url 'materials:material_list' %}" class="w-full md:w-auto bg-gray-500 text-white px-4 py-2 rounded-lg shadow-md hover:bg-gray-600 transition-colors duration-300 text-center">Clear</a>
        </div>
        <a href="{% url 'materials:material_create' %}" class="bg-[#233b6e] text-white font-semibold py-2 px-6 rounded-lg text-center transition-colors duration-300 hover:bg-[#1a2c53]">Create New Material</a>
    </div>
</div>


{% endblock content %}
